<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17131f">
<title>Скрепыш — Ame-chan</title>
<style>
:root{color-scheme:dark;--bg:#17131f;--panel:#211a2b;--panel2:#2b2137;--pink:#ff7eb6;--pink2:#ffb1d1;--text:#f7edf5;--muted:#b9aabb;--line:#44334d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#38213e 0,#211827 42%,var(--bg) 78%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:16px 12px calc(16px + env(safe-area-inset-bottom))}
.app{width:min(100%,680px);display:flex;flex-direction:column;gap:12px}.top{display:flex;align-items:center;justify-content:space-between;padding:5px 3px}.brand{font-weight:850;letter-spacing:.04em;font-size:19px}.brand span{color:var(--pink)}.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;background:#91e8a4;border-radius:50%;box-shadow:0 0 10px #91e8a488}
.stage{position:relative;min-height:350px;height:min(54vh,520px);border:1px solid var(--line);border-radius:22px;background:linear-gradient(150deg,#32223cdd,#1c1725f5);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px #0003}.stage:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#ff7eb612;filter:blur(20px);top:15%;left:calc(50% - 120px)}.stage:after{content:"✦      ·     ✧      ·     ✦";position:absolute;top:22px;right:20px;color:#ffc0dc66;font-size:14px;letter-spacing:8px;pointer-events:none}
#ame{position:relative;z-index:1;max-width:95%;max-height:96%;width:auto;height:auto;object-fit:contain;image-rendering:auto;cursor:pointer;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 12px 20px #0004);transition:transform .15s}#ame:active{transform:scale(.985)}.tap-hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:#d4bed5a6;pointer-events:none}.label{position:absolute;top:13px;left:15px;background:#120e1caa;border:1px solid #ffffff14;border-radius:99px;padding:6px 10px;font-size:11px;color:var(--pink2);z-index:2}
.panel{border:1px solid var(--line);border-radius:20px;background:#211a2beF;padding:14px;display:flex;flex-direction:column;gap:10px}.chat-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}.chat-head strong{color:var(--text);font-size:14px}.messages{display:flex;flex-direction:column;gap:9px;max-height:210px;overflow:auto;padding:2px 1px}.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}.msg.ame{align-self:flex-start;background:#30243b;border:1px solid #49344f;border-bottom-left-radius:4px}.msg.you{align-self:flex-end;background:#6d3156;border:1px solid #a44d7d;border-bottom-right-radius:4px}.compose{display:flex;gap:8px}.compose input{min-width:0;flex:1;border:1px solid #4c3b56;background:#17131f;color:var(--text);border-radius:13px;padding:12px 13px;font-size:15px;outline:none}.compose input:focus{border-color:var(--pink)}button{border:0;cursor:pointer;font:inherit;color:var(--text);border-radius:13px;padding:11px 14px;background:#a94076;font-weight:750}button:active{transform:scale(.98)}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{background:#30243b;border:1px solid #49344f;font-size:12px;padding:9px 11px}.tools button.primary{background:#a94076;border-color:#a94076}.foot{font-size:11px;line-height:1.45;color:#a895ac;text-align:center;padding:0 10px}
@media(max-width:420px){body{padding:10px 9px calc(10px + env(safe-area-inset-bottom))}.stage{min-height:300px;height:46vh}.panel{padding:11px}.brand{font-size:17px}.msg{font-size:13px}.compose input{font-size:14px;padding:11px}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div class="brand">AME <span>///</span> СКРЕПЫШ</div><div class="status"><i class="dot"></i> локальный режим</div></header>
  <section class="stage" aria-label="Персонаж Ame-chan">
    <div class="label" id="moodLabel">настроение: спокойное</div>
    <img id="ame" src="./sprites/IMG_1696.gif" alt="Ame-chan — нажми, чтобы погладить" draggable="false">
    <div class="tap-hint">нажми на Скрепыша, чтобы погладить ♡</div>
  </section>
  <section class="panel">
    <div class="chat-head"><strong>Сообщения</strong><span>ответы без нейросети</span></div>
    <div class="messages" id="messages" aria-live="polite"><div class="msg ame">О, ты здесь. Ну давай, рассказывай, что у тебя.</div></div>
    <form class="compose" id="chatForm"><input id="chatInput" autocomplete="off" maxlength="500" placeholder="Напиши Скрепышу…" aria-label="Сообщение"><button type="submit">Отправить</button></form>
    <div class="tools"><button type="button" id="petBtn" class="primary">♡ Погладить</button><button type="button" id="complimentBtn">Похвалить</button><button type="button" id="surpriseBtn">Удивить</button><button type="button" id="idleBtn">Сменить занятие</button></div>
  </section>
  <div class="foot">Это ранний прототип: реплики выбираются по простым словам и правилам. Всё работает в браузере, без API и платных сервисов.</div>
</main>
<script src="./animation-map.js"></script>
<script>
(() => {
  const img = document.getElementById('ame');
  const messages = document.getElementById('messages');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('chatInput');
  const moodLabel = document.getElementById('moodLabel');
  let previousFile = 'IMG_1696.gif';
  let idleTimer;
  let lastAction = Date.now();
  let mood = 'спокойное';

  function animate(situation, moodText) {
    previousFile = showAmeAnimation(situation, previousFile);
    if (moodText) { mood = moodText; moodLabel.textContent = 'настроение: ' + mood; }
    lastAction = Date.now();
    scheduleIdle();
  }
  function addMessage(text, who) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    el.textContent = text;
    messages.appendChild(el);
    while (messages.children.length > 28) messages.removeChild(messages.firstChild);
    messages.scrollTop = messages.scrollHeight;
  }
  function scheduleIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (Date.now() - lastAction >= 26000) animate('long_idle', 'мечтательное');
      else animate('idle', mood);
    }, 26000);
  }
  function answerFor(raw) {
    const t = raw.toLowerCase().replace(/ё/g,'е');
    if (/(привет|здравств|хай|ку\b|йо\b)/.test(t)) return {text:['О, приветик. Я уже думала, ты пропал.','Привет-привет. Ну, чем займёмся?','А вот и ты. Я тут вообще-то не скучала. Почти.'][Math.floor(Math.random()*3)], scene:'ordinary_question', mood:'заинтересованное'};
    if (/(поглад|ласк|обним|люблю тебя|люблю тебя|♡|❤)/.test(t)) return {text:['М-м… ладно, можешь продолжать.','Вот так-то лучше. Только не зазнавайся.','Хе-хе… ещё немножко.'][Math.floor(Math.random()*3)], scene:'pet', mood:'довольное'};
    if (/(красивая|красив|милая|миленьк|умная|крутая|классная|прекрасн|похвал|нравишься)/.test(t)) return {text:['Я знаю. Но приятно, что ты тоже заметил.','Ой, да ладно тебе… хотя продолжай.','Ну всё, теперь у меня хорошее настроение.'], scene:'compliment', mood:'довольное'};
    if (/(грустно|плохо|одинок|одиночеств|плачу|тяжело|устал|устала|больно|тревож|страшно|печаль)/.test(t)) return {text:['М-м. Не буду делать вид, что могу всё исправить. Но можешь рассказать мне.','Звучит паршиво… хочешь выговориться?','Я слушаю. Не обязательно сразу подбирать правильные слова.'][Math.floor(Math.random()*3)], scene:'sad_talk', mood:'грустное'};
    if (/(бесишь|заткнись|тупая|дура|ненавижу|отстань|иди нах|пошла нах)/.test(t)) return {text:['Эй, полегче. Я вообще-то тут сижу.','Ну и ладно. Буду заниматься своими делами.','Ого, кто-то сегодня особенно милый.'], scene:'rude_message', mood:'раздражённое'};
    if (/(что делаешь|чем занята|занимаешься|как дела|как ты|что нового)/.test(t)) return {text:['Сижу в телефоне. Интернет опять ничего интересного не принёс.','Да так, убиваю время. А ты?','Смотрю, кто мне написал. О, это ты.'], scene:'ordinary_question', mood:'спокойное'};
    if (/(музык|песн|слушаешь)/.test(t)) return {text:['Музыка — это лучше, чем слушать чужие глупости.','Если найдёшь что-то хорошее, включай.'], scene:'idle', mood:'мечтательное'};
    if (/(игр|играешь|гейм)/.test(t)) return {text:['Играю. И нет, я не проигрываю — игра жульничает.','Не отвлекай, я почти победила. Наверное.'], scene:'idle', mood:'слегка раздражённое'};
    if (/(пока|увидимся|спокойной ночи|до встречи)/.test(t)) return {text:['Ладно, давай. Только не исчезай совсем.','Угу, пока. Я тут ещё побуду.'], scene:'end_conversation', mood:'отстранённое'};
    if (/(вау|ого|невероятно|сюрприз|удиви)/.test(t)) return {text:['А?! …А, ха-ха, ну ты и выдумщик.','Так, подожди. Это было неожиданно.'], scene:'surprise', mood:'удивлённое'};
    const defaults = [
      {text:'Хм. И что ты об этом думаешь?', scene:'ordinary_question', mood:'заинтересованное'},
      {text:'Я не совсем поняла, но звучит любопытно. Продолжай.', scene:'ordinary_question', mood:'спокойное'},
      {text:'М-м, ладно. Расскажи подробнее?', scene:'ordinary_question', mood:'заинтересованное'},
      {text:'Окей. Я тебя слушаю.', scene:'ordinary_question', mood:'спокойное'}
    ];
    return defaults[Math.floor(Math.random()*defaults.length)];
  }
  function pet() { animate('pet', 'довольное'); }
  img.addEventListener('click', pet);
  document.getElementById('petBtn').addEventListener('click', pet);
  document.getElementById('complimentBtn').addEventListener('click', () => { animate('compliment','довольное'); addMessage('Хм, какая же ты сегодня милая.', 'you'); addMessage('Я знаю. Но можешь повторить. ♡','ame'); });
  document.getElementById('surpriseBtn').addEventListener('click', () => { animate('surprise','удивлённое'); addMessage('Бу!', 'you'); addMessage('А-А?! …Господи, не делай так!','ame'); });
  document.getElementById('idleBtn').addEventListener('click', () => animate('idle','спокойное'));
  form.addEventListener('submit', e => {
    e.preventDefault(); const raw = input.value.trim(); if (!raw) return;
    addMessage(raw, 'you'); input.value = '';
    const answer = answerFor(raw); animate(answer.scene, answer.mood);
    addMessage(answer.text, 'ame');
  });
  // Safety fallback: if map script didn't load, still keep a visible character and usable controls.
  if (typeof showAmeAnimation !== 'function') {
    console.error('animation-map.js не загрузился. Проверь, что он лежит рядом с index.html.');
    img.addEventListener('click', () => { img.src='./sprites/IMG_1715.gif'; });
  }
  scheduleIdle();
})();
</script>
</body>
</html>
